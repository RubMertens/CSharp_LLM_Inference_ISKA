<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>slide probe</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/svg.css">
  <link rel="stylesheet" href="css/vscode.css">
</head>
<body>
  <div id="progress"></div>
  <div id="presentation"></div>
  <span id="slide-counter"></span>
  <script type="module" src="js/vscode-code.js"></script>
  <script type="module">
    // Drives the real engine so fragment stepping can be checked in a screenshot:
    //   probe-slide.html?slide=dot-product-code&steps=2
    const params = new URLSearchParams(location.search);
    if (params.get('slide')) location.hash = params.get('slide');
    const { engine } = await import('./js/engine.js');
    const steps = Number(params.get('steps') ?? 0);
    // let the async code windows render before stepping
    await new Promise(r => setTimeout(r, 4000));
    for (let i = 0; i < steps; i++) engine.next();
    document.title = `engine probe — stepped ${steps}`;
  </script>
</body>
</html>
