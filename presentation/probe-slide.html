<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>slide probe</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/svg.css">
  <link rel="stylesheet" href="css/vscode.css">
</head>
<body>
  <div id="progress"></div>
  <div id="presentation"></div>
  <span id="slide-counter"></span>
  <script type="module" src="js/vscode-code.js"></script>
  <script type="module">
    // Drives the real engine so fragment stepping can be checked in a screenshot:
    //   probe-slide.html?slide=dot-product-code&steps=2
    const params = new URLSearchParams(location.search);
    if (params.get('slide')) location.hash = params.get('slide');
    const { engine } = await import('./js/engine.js');
    const steps = Number(params.get('steps') ?? 0);
    // let the async code windows render before stepping
    await new Promise(r => setTimeout(r, 4000));
    for (let i = 0; i < steps; i++) engine.next();
    document.title = `slide probe — stepped ${steps}`;

    // ?debug=1 prints layout measurements into the page, so a screenshot can show
    // why a code window was clamped.
    if (params.get('debug')) {
      await new Promise(r => setTimeout(r, 600));
      const slide = document.querySelector('.slide.active');
      const pres = document.getElementById('presentation');
      const lines = [
        `viewport ${innerWidth}x${innerHeight} docEl ${document.documentElement.clientHeight}`,
        `#presentation ${Math.round(pres.getBoundingClientRect().height)}`
          + ` top ${Math.round(pres.getBoundingClientRect().top)}`,
        `slide rect top ${Math.round(slide.getBoundingClientRect().top)}`
          + ` bottom ${Math.round(slide.getBoundingClientRect().bottom)}`
          + ` scrollHeight ${slide.scrollHeight} clientHeight ${slide.clientHeight}`,
        ...[...slide.querySelectorAll('.vscode-window')].map((w, i) => {
          const code = w.querySelector('.vscode-code');
          return `window ${i}: window ${Math.round(w.getBoundingClientRect().height)}`
            + ` code ${Math.round(code.getBoundingClientRect().height)}`
            + ` scroll ${code.scrollHeight} max ${code.style.maxHeight || '(css)'}`
            + ` font ${w.style.getPropertyValue('--vs-font-size')}`;
        }),
        ...[...slide.children].map(c => `${c.className || c.tagName}: ${Math.round(c.getBoundingClientRect().height)}`),
      ];
      const box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;background:#003865;color:#fff;'
        + 'padding:8px;font-size:11px;line-height:1.4;max-width:60vw;white-space:pre-wrap';
      box.textContent = lines.join('\n');
      document.body.appendChild(box);
    }
  </script>
</body>
</html>
