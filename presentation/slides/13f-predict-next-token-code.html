      <pre class="vscode-source">
public int PredictNextTokenGreedy(int[] tokens)
{
    var logits = Forward(tokens);
    Vector last = logits[tokens.Length - 1];
    var best = last.Data.Max();
    var bestIndex = Array.IndexOf(last.Data, best);
    return bestIndex;
}
