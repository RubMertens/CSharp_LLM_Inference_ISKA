<section data-id="vector-definition" data-title="What Is a Vector">
  <div class="slide-content">
    <h2>A <span class="highlight">vector</span> is an arrow — direction and length</h2>

    <div class="svg-fill">
      <svg class="svg-diagram" viewBox="0 0 860 420" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

        <!-- Local arrowheads: the shared ones in index.html are 50% opacity,
             which reads as a faded tip on a solid 3px vector. -->
        <defs>
          <marker id="vd-head" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
            <polygon points="0 0, 6 2.5, 0 5" class="fill-accent"/>
          </marker>
          <marker id="vd-head-muted" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
            <polygon points="0 0, 6 2.5, 0 5" class="fill-muted"/>
          </marker>
        </defs>

        <!-- ── Axes, origin at (200, 340), one unit = 75px ── -->
        <line class="svg-axis" x1="120" y1="340" x2="545" y2="340"/>
        <line class="svg-axis" x1="200" y1="380" x2="200" y2="60"/>
        <text class="svg-muted" style="font-size:14px" x="558" y="340">x</text>
        <text class="svg-muted" style="font-size:14px" x="200" y="48">y</text>

        <!-- Unit ticks -->
        <line class="svg-axis" x1="275" y1="335" x2="275" y2="345"/>
        <line class="svg-axis" x1="350" y1="335" x2="350" y2="345"/>
        <line class="svg-axis" x1="425" y1="335" x2="425" y2="345"/>
        <line class="svg-axis" x1="500" y1="335" x2="500" y2="345"/>
        <line class="svg-axis" x1="195" y1="265" x2="205" y2="265"/>
        <line class="svg-axis" x1="195" y1="190" x2="205" y2="190"/>
        <line class="svg-axis" x1="195" y1="115" x2="205" y2="115"/>

        <!-- The vector itself: origin → (2, 3) -->
        <line class="svg-vec" x1="200" y1="340" x2="350" y2="115"
              stroke="var(--color-accent, #1C8680)" marker-end="url(#vd-head)"/>
        <text class="svg-label" style="font-size:22px" x="376" y="98">a</text>

        <!-- ── The list, same box styling the dot product slide uses ── -->
        <text class="svg-label" style="font-size:26px;text-anchor:start" x="548" y="150">a =</text>
        <path class="svg-bracket" d="M 634,114 Q 620,114 620,128 L 620,172 Q 620,186 634,186"/>
        <rect class="svg-box" x="640" y="118" width="70" height="64"/>
        <text class="svg-num" style="font-size:30px" x="675" y="150">2</text>
        <rect class="svg-box" x="720" y="118" width="70" height="64"/>
        <text class="svg-num" style="font-size:30px" x="755" y="150">3</text>
        <path class="svg-bracket" d="M 796,114 Q 810,114 810,128 L 810,172 Q 810,186 796,186"/>

        <!-- Step 0: the numbers are the coordinates of the tip -->
        <g class="fragment">
          <line class="svg-proj" x1="350" y1="115" x2="350" y2="340" stroke="var(--color-accent-secondary, #29AC8D)"/>
          <line class="svg-proj" x1="350" y1="115" x2="200" y2="115" stroke="var(--color-accent-secondary, #29AC8D)"/>
          <circle cx="350" cy="115" r="6" fill="var(--color-accent, #1C8680)"/>
          <text class="svg-num fill-accent" style="font-size:18px;font-weight:bold" x="350" y="364">2</text>
          <text class="svg-num fill-accent" style="font-size:18px;font-weight:bold" x="174" y="115">3</text>
          <text class="svg-muted" style="font-size:15px" x="675" y="204">x</text>
          <text class="svg-muted" style="font-size:15px" x="755" y="204">y</text>
        </g>

        <!-- Step 1: how long — the tip rides a circle of radius |a| -->
        <g class="fragment">
          <path class="svg-circle" style="stroke:var(--color-accent, #1C8680);stroke-width:1.6;opacity:0.45" d="M 470.4,340 A 270.4,270.4 0 0,0 200,69.6"/>
          <text class="svg-text fill-accent" style="font-size:17px" x="496" y="248">3.61</text>
        </g>




      </svg>
    </div>
  </div>

  <style>
    [data-id="vector-definition"] h2 {
      margin-bottom: 0.4em;
    }

    @media (max-width: 820px) {
      [data-id="vector-definition"] h2 {
        font-size: 1.15rem;
      }
    }
  </style>
</section>
