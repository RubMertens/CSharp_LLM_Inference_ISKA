<section data-id="vector-definition" data-title="What Is a Vector">
  <div class="slide-content" style="display: flex; flex-direction: column; justify-content: center; gap: clamp(0.4rem, 1.4vh, 1rem); padding-bottom: 1.2rem;">
    <div>
      <h2 style="margin-bottom: 0.2em;">A <span class="highlight">vector</span> is an ordered list of numbers</h2>
      
    </div>

    <div class="vec-diagram">
      <svg class="svg-diagram" viewBox="0 0 860 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

        <!-- Name, so this reads as the literal a = [2, 3, 1, 4] -->
        <text class="svg-label" style="font-size:26px" x="170" y="69">a =</text>

        <!-- Brackets around the list -->
        <path class="svg-bracket" d="M 226,26 Q 212,26 212,40 L 212,98 Q 212,112 226,112"/>
        <path class="svg-bracket" d="M 634,26 Q 648,26 648,40 L 648,98 Q 648,112 634,112"/>

        <!-- The four numbers — same vector the dot product and RMSNorm slides use -->
        <rect class="svg-box" x="232" y="30" width="90" height="78"/>
        <text class="svg-num" style="font-size:32px" x="277" y="69">2</text>

        <rect class="svg-box" x="334" y="30" width="90" height="78"/>
        <text class="svg-num" style="font-size:32px" x="379" y="69">3</text>

        <rect class="svg-box" x="436" y="30" width="90" height="78"/>
        <text class="svg-num" style="font-size:32px" x="481" y="69">1</text>

        <rect class="svg-box" x="538" y="30" width="90" height="78"/>
        <text class="svg-num" style="font-size:32px" x="583" y="69">4</text>

        <!-- Step 0: the "ordered" half of the definition -->
        <g class="fragment">
          <text class="svg-muted" style="font-size:16px" x="277" y="130">0</text>
          <text class="svg-muted" style="font-size:16px" x="379" y="130">1</text>
          <text class="svg-muted" style="font-size:16px" x="481" y="130">2</text>
          <text class="svg-muted" style="font-size:16px" x="583" y="130">3</text>
          <text class="svg-sublabel" style="font-size:13px" x="430" y="152">position</text>

          <text class="svg-formula" style="font-size:17px" x="430" y="182">
            Ordered — [2, 3, 1, 4] is not the same vector as [4, 3, 1, 2]
          </text>
        </g>
      </svg>
    </div>


    </div>
  </div>

  <style>
    [data-id="vector-definition"] h2 {
      margin-bottom: 0.2em;
    }

    /* Capped rather than .svg-fill: flex:1 would hand the whole leftover column to
       the diagram and push the two cards off the bottom of the slide. */
    [data-id="vector-definition"] .vec-diagram {
      width: 100%;
      max-width: min(1080px, 100%);
      margin: 0 auto;
      flex: 0 0 auto;
    }

    @media (max-width: 820px) {
      [data-id="vector-definition"] h2 {
        font-size: 1.25rem;
      }
    }
  </style>
</section>
