      <pre class="vscode-source">
public static float[] Softmax(float[] input)
{
    float max = input.Max();
    var exp = input.Select(x =&gt; MathF.Exp(x - max)).ToArray();
    float sum = exp.Sum();

    return exp.Select(x =&gt; x / sum).ToArray();
}
