    .title-h1-wrap {

    /* per-letter wave bounce + holographic gradient + glow pulse */
    .slide-title h1.title-holo {

      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;

         through the full colour wheel — the one thing the ISKS palette cannot survive.
         will-change dropped too: it promoted all 28 letters to their own compositor layer.
         The gradient still slides and the letters still wave. */
      animation:
        title-holo-slide 6s linear infinite,
        title-ltr-wave 2.2s ease-in-out infinite;
      animation-delay:
        calc(var(--i) * -0.12s),

    .title-orbit {

    .title-orbit-1 .title-orbit-emoji { animation-duration: 9s, 2.8s; animation-delay: 0s,     0s; }
    .title-orbit-2 .title-orbit-emoji { animation-duration: 9s, 2.8s; animation-delay: -2.25s, -0.7s; }

    @keyframes title-orbit-counter {

    @media (max-width: 820px) {
